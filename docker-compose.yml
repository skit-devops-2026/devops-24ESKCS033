# ============================================================
# RealEstate – Property Discovery Platform
# docker-compose.yml
# ============================================================

version: "3.9"

services:
  # ── Main application service ─────────────────────────────
  realestate:
    # Build from the Dockerfile in the current directory
    build:
      context: .
      dockerfile: Dockerfile

    # Image name for the container
    image: akshat2026/realestate-platform:latest

    # Container name for easy reference
    container_name: realestate-app

    # Port mapping: host:container
    ports:
      - "${PORT:-8000}:8000"

    # Environment variables (loaded from .env if present)
    environment:
      - PORT=8000

    # Restart policy
    restart: unless-stopped

    # Health check override
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
