# ============================================================
# GitHub Actions – Docker Build, Push & Deployment Pipeline
# RealEstate – Property Discovery Platform
# M5: Docker image build + push to Docker Hub
# ============================================================

name: Docker Build & Push

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:      # Allow manual trigger from Actions tab

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up QEMU for multi-platform builds (optional but good practice)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Log in to Docker Hub using GitHub Secrets
      #    Add secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
      #    in your repo Settings → Secrets and Variables → Actions
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/realestate-platform:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/realestate-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Verify the image is accessible
      - name: Verify image pull
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/realestate-platform:latest
          docker run --rm -d -p 8000:8000 --name test-container \
            ${{ secrets.DOCKERHUB_USERNAME }}/realestate-platform:latest
          sleep 5
          curl -f http://localhost:8000 && echo "✅ Container is responding on port 8000"
          docker stop test-container
          echo "✅ Docker image verified successfully"

      # 7. Print image digest
      - name: Image digest
        run: echo "Docker image pushed successfully → ${{ secrets.DOCKERHUB_USERNAME }}/realestate-platform:latest"
