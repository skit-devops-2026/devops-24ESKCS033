[pytest]
# RealEstate – Property Discovery Platform
# Student: Akshat Gupta | 24ESKCS019
# Course:  DevOps (MT1 – Modules 1-4)

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Custom markers
markers =
    smoke: fast sanity-check tests
    unit: pure unit tests with no external deps
    integration: tests that touch the filesystem or HTML
    edge: edge-case and boundary condition tests
